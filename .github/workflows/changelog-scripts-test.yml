name: Changelog Scripts Test

on:
  pull_request:
    paths:
      - '.github/scripts/generate_changelog.py'
      - '.github/scripts/changelog_release.py'
      - '.github/scripts/test_generate_changelog.py'
      - '.github/scripts/test_changelog_release.py'
      - '.github/workflows/generate-changelog.yml'
      - '.github/workflows/changelog-scripts-test.yml'

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests==2.32.3 --quiet

      - name: Unit tests
        working-directory: .github/scripts
        run: python3 -m unittest test_changelog_release test_generate_changelog -v
