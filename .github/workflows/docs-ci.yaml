name: Docs CI

on:
  pull_request:
    paths:
      - "docs/**"
      - "api/v4/source/**"
      - "api/playbooks/**"
  push:
    branches:
      - master
    paths:
      - "docs/**"
      - "api/v4/source/**"
      - "api/playbooks/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: docs/site/.nvmrc
          cache: "npm"
          cache-dependency-path: docs/site/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: api/server/go.mod

      - name: Install docs dependencies
        working-directory: docs/site
        run: npm ci

      - name: Typecheck
        working-directory: docs/site
        run: npm run typecheck

      - name: Egress-check unit tests
        working-directory: docs/site
        run: npm run test:egress

      - name: Build docs site (includes OpenAPI prebuild)
        working-directory: docs/site
        run: npm run build
        env:
          ALGOLIA_APP_ID: ${{ vars.ALGOLIA_APP_ID }}
          ALGOLIA_SEARCH_API_KEY: ${{ vars.ALGOLIA_SEARCH_API_KEY }}

      - name: Check absolute docs.mattermost.com links
        working-directory: docs/site
        run: npm run check:absolute-links

      # Hosted Algolia injects SearchBar preconnects; do not scan that artifact.
      # Rebuild without ALGOLIA_* (prebuild already ran) for the offline shape.
      - name: Rebuild without Algolia for egress scan
        working-directory: docs/site
        run: npx docusaurus build && npm run postbuild
        env:
          BASE_URL: /

      - name: Scan built site for egress
        working-directory: docs/site
        run: npm run check:egress
